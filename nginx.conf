# /etc/nginx/sites-enabled/fxgh.lapius7.com の元ファイル(このリポジトリで管理し、変更したらコピーして nginx -t && reload)
server {
    listen 80;
    listen [::]:80;
    server_name fxgh.lapius7.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name fxgh.lapius7.com;

    # *.lapius7.com のCloudflareオリジン証明書(bin.lapius7.com等と共通)
    ssl_certificate /etc/nginx/ssl/lapius7.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/lapius7.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8140;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
